<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Latin Trainer Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#161412;--surface:#1e1b18;--surface2:#252118;--surface3:#2c271f;--border:#35302a;--border2:#4a4238;--text:#e8e0d5;--text2:#9e9080;--text3:#665e52;--accent:#c8955a;--red:#e07a6a;--green:#7fb87a;--serif:'IM Fell English',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
#engine{position:absolute;width:1px;height:1px;left:-9999px;top:0;border:0;visibility:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans)}
.ad-hide{display:none!important}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:50}
.g-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
.g-box h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:6px 0 4px}
.g-box p{font-size:13px;color:var(--text3);margin:0 0 16px;line-height:1.45}
.ad-in{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font:inherit;font-size:14px;outline:none}
.ad-in:focus{border-color:var(--accent)}
.g-box .ad-in{margin:0 0 8px}
.ad-btn{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer}
.ad-btn:hover{border-color:var(--accent)}.ad-btn:disabled{opacity:.5;cursor:default}
.ad-btn.pri{background:var(--accent);border-color:var(--accent);color:#1a120a}.ad-btn.bad{color:var(--red)}.ad-btn.on{border-color:var(--accent);color:var(--accent)}
.ad-btn.sm{font-size:12px;padding:5px 10px;font-weight:500}
.g-err{min-height:18px;font-size:12.5px;color:var(--red);margin:6px 0 2px}
.g-lnk{background:none;border:0;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:10px}
#app{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.ad-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ad-top h1{font-family:var(--serif);font-weight:400;font-size:26px;margin-right:auto}
.ad-top h1 small{font-family:var(--sans);font-size:12px;color:var(--text3);margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.ad-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:16px}
.ad-tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--text2);font:inherit;font-size:14px;padding:9px 12px;cursor:pointer}
.ad-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.ad-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.ad-card h2{font-size:15px;font-weight:600;margin:0 0 10px}
.ad-card .hint{font-size:12.5px;color:var(--text3);margin:-4px 0 10px;line-height:1.45}
.ad-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ad-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.ad-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ad-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:110px}
.ad-stat b{display:block;font-size:20px}.ad-stat span{font-size:12px;color:var(--text3)}
table.ad-t{width:100%;border-collapse:collapse;font-size:13.5px}
.ad-t th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
.ad-t td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.ad-t tr.click{cursor:pointer}.ad-t tr.click:hover td{background:var(--surface2)}
.ad-t td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--text2);margin:1px 3px 1px 0;white-space:nowrap}
.pill.g{border-color:#5d8a59;color:var(--green)}.pill.r{border-color:#8a4f45;color:var(--red)}.pill.a{border-color:var(--accent);color:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px}
.ad-scroll{overflow-x:auto}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end;z-index:40}
#panel .pn{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--border2);padding:18px 18px 40px}
.pn-name{font-size:22px;margin:4px 0 6px}
.pn-sc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.pn-sc div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center}
.pn-sc b{display:block;font-size:17px}.pn-sc span{display:block;font-size:11.5px;color:var(--text3)}.pn-sc button{margin-top:4px}
.pn-acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.pn-out{margin-top:8px}
.chat-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
.chat-row .t{font-size:11.5px;color:var(--text3);white-space:nowrap;min-width:86px}
.chat-row .m{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13.5px}
.chat-row.hid{opacity:.55}
#adToast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:9px 16px;border-radius:999px;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;max-width:90vw}
textarea.ad-in{min-height:90px;resize:vertical}
.ad-list div{font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}
@media (max-width:640px){.ad-hide-sm{display:none}.pn-sc{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="boot">Loading…</div>
<div id="gate" class="ad-hide"></div>
<div id="app" class="ad-hide">
  <div class="ad-top"><h1>Latin Trainer <small>Admin</small></h1>
    <button class="ad-btn sm" id="adReload" title="Load everything again">↻ Refresh</button>
    <a class="ad-btn sm" href="index.html" target="_blank" rel="noopener" style="text-decoration:none">Open the site ↗</a>
    <button class="ad-btn sm" id="adOut">Log out</button></div>
  <div class="ad-tabs" id="adTabs"></div>
  <div id="view"></div>
</div>
<div id="panel" class="ad-hide"></div>
<div id="adToast"></div>
<iframe id="engine" title="engine" aria-hidden="true" tabindex="-1"></iframe>

<script type="text/plain" id="engineModule">// ── Admin module: runs inside the invisible copy of the site (index.html?engine=1), so it can use the site's word
// lists and badge rules. Everything here uses the admin login; nothing is saved on the device.
var isAdmin=true;
const P=window.parent;
window.prompt=(m,d)=>P.prompt(m,d);window.alert=m=>P.alert(m);window.confirm=m=>P.confirm(m);toast=m=>P.ADMUI.toast(m);
const A={admin:true};
const ADM={
  data:null,
  changed(pid){try{P.ADMUI.changed(pid);}catch(e){}},
  async load(){
    const g=async(path,q)=>{try{return (await fbReq('GET',path,null,q?{...A,query:q}:A))||{};}catch(e){return {};}};
    const [players,atag,appr,hide,mute,prem,strk,nlock,online,contact,challenge,desc,ann]=await Promise.all(
      ['players','atag','appr','lbhide','mute','prem','strk','nlock','online','contact','challenge','description','announce'].map(x=>g(x)));
    lbPlayers=players;ATAG=atag;APPR=appr;atagLoaded=true;lbHidden=new Set(Object.keys(hide).filter(k=>hide[k]===true));mutedSet=new Set(Object.keys(mute).filter(k=>mute[k]===true));
    CONTACT=typeof contact==='string'?contact:'';classChal=challenge&&challenge.target?challenge:null;annCur=ann&&ann.text?ann:null;
    this.data={players,atag,appr,hide,mute,prem,strk,nlock,online,contact:CONTACT,challenge:classChal,desc:typeof desc==='string'?desc:'',ann:annCur,at:Date.now()};
    return this.data;},
  nameEl(pid){const p=lbPlayers[pid]||{};return nameEl(pid,p.name||'(no name)');},
  scores(pid){const p=lbPlayers[pid]||{},k=lbKeys();return {d:lbScore(p,'d',k),w:lbScore(p,'w',k),m:lbScore(p,'m',k),all:lbScore(p,'all',k)};},
  badgeChips(pid){try{return badgeChipsEl(lbPlayers[pid],true,pid);}catch(e){return null;}},
  // the public leaderboard copy: members and approved players who aren't hidden (the server checks every entry)
  async pubSync(){let all,pub,hid,at,ap;try{[all,pub,hid,at,ap]=await Promise.all(['players','pub','lbhide','atag','appr'].map(x=>fbReq('GET',x,null,A)));}catch(e){return -1;}
    all=all||{};pub=pub||{};hid=hid||{};at=at||{};ap=ap||{};const isPub=u=>u===ADMIN_UID||!!at[u]||ap[u]===true;const body={};
    Object.entries(all).forEach(([u,p])=>{const show=p&&p.name&&isPub(u)&&!hid[u];if(!show){if(pub[u])body['pub/'+u]=null;return;}const o={};PUB_F.forEach(k=>{if(p[k]!=null)o[k]=p[k];});const c={};PUB_F.forEach(k=>{if(pub[u]&&pub[u][k]!=null)c[k]=pub[u][k];});
      if(JSON.stringify(sortDeep(o))!==JSON.stringify(sortDeep(c)))body['pub/'+u]=o;});
    Object.keys(pub).forEach(u=>{if(!all[u])body['pub/'+u]=null;});
    const ks=Object.keys(body);for(let i=0;i<ks.length;i+=40){const part={};ks.slice(i,i+40).forEach(k=>part[k]=body[k]);try{await fbReq('PATCH','',part,A);}catch(e){}}return ks.length;},
  async editPoints(pid,per){const name=(lbPlayers[pid]||{}).name||'?',label=LB_PERIOD_NAME[per],p=lbPlayers[pid]||{},k=lbKeys(),cur=lbScore(p,per,k);
    const v=prompt('Set '+name+'’s score for '+label+' to:'+(per==='all'?'':'\n(Week, month and all-time totals move up or down by the same amount.)'),cur);
    if(v===null)return false;const n=Math.floor(Number(v));if(!Number.isFinite(n)){alert('Enter a whole number (it can be negative).');return false;}
    const val={d:lbScore(p,'d',k),w:lbScore(p,'w',k),m:lbScore(p,'m',k),all:lbScore(p,'all',k)},order=['d','w','m','all'],i=order.indexOf(per),delta=n-val[per];
    order.forEach((x,j)=>{if(j===i)val[x]=n;else if(j>i)val[x]=val[x]+delta;});
    for(let j=order.length-2;j>=0;j--)val[order[j]]=Math.min(val[order[j]],val[order[j+1]]);   // smaller periods never exceed bigger ones
    const body={total:val.all,['d/'+k.d]:val.d,['w/'+k.w]:val.w,['m/'+k.m]:val.m};
    try{await fbReq('PATCH','players/'+pid,body,A);toast('Saved: '+name+' → '+n.toLocaleString()+' ('+label+').');await this.pubSync();return true;}catch(e){alert('Couldn’t save '+name+'’s score ('+e.message+').');return false;}},
  async rename(pid){await adminRename(pid);await this.pubSync();},
  async toggle(kind,pid){const path={lock:'nlock',mute:'mute',hide:'lbhide',appr:'appr'}[kind],on=!(this.data&&this.data[{lock:'nlock',mute:'mute',hide:'hide',appr:'appr'}[kind]]||{})[pid];
    await fbReq(on?'PUT':'DELETE',path+'/'+pid,on?true:null,A);
    if(kind==='mute'&&on)await chatPurge(x=>x===pid);
    await this.load();if(kind==='hide'||kind==='appr')await this.pubSync();return on;},
  async premium(pid){const pl=lbPlayers[pid]||{},prem=(this.data.prem||{})[pid];
    if(prem){if(!confirm('Remove premium from '+(pl.name||'this player')+'? Their premium avatar, fonts and effects will be taken off.'))return;
      await fbReq('DELETE','prem/'+pid,null,A);const strip={};if(pl.av===PREMIUM_AV)strip.av=null;if(PREMIUM_FONTS.includes(pl.font))strip.font=null;if(PREMIUM_FX.includes(pl.fx))strip.fx=null;
      if(Object.keys(strip).length)await fbReq('PATCH','players/'+pid,strip,A);}
    else await fbReq('PUT','prem/'+pid,{c:'admin',t:{'.sv':'timestamp'}},A);
    await this.load();await this.pubSync();},
  async remove(pid){const n=(lbPlayers[pid]||{}).name||'this player';if(!confirm('Remove '+n+' from the leaderboard? Their points are deleted.'))return false;
    await fbReq('DELETE','players/'+pid,null,A);await fbReq('DELETE','pub/'+pid,null,A).catch(()=>{});await this.load();return true;},
  async tag(pid){await atagEdit(pid,(lbPlayers[pid]||{}).name||'?');await this.load();await this.pubSync();},
  async streak(pid,btn){await streakEdit(pid,(lbPlayers[pid]||{}).name||'?',btn);await this.load();},
  // chat
  async chat(){let r={};try{r=(await fbReq('GET','chat',null,{...A,query:'?orderBy=%22$key%22&limitToLast=200'}))||{};}catch(e){}chatObj=safeKeys(r);return Object.entries(chatObj).map(([id,m])=>({id,...m})).filter(m=>m&&typeof m.text==='string').sort((a,b)=>(a.t||0)-(b.t||0));},
  async editMsg(id){await adminEditMsg(id);},
  async delMsg(id){await fbReq('DELETE','chat/'+id,null,A);},
  // site content
  async saveDesc(text){const r=await acFetch(FB_DESC+'?auth='+encodeURIComponent(await adminToken()),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(text)});if(!r.ok)throw new Error('HTTP '+r.status);},
  async saveAnn(title,text){await fbReq('PUT','announce',{title,text,t:{'.sv':'timestamp'}},A);},
  async removeAnn(){await fbReq('DELETE','announce',null,A);},
  async saveContact(t){await fbReq(t?'PUT':'DELETE','contact',t||null,A);CONTACT=t;},
  async saveChallenge(n,title){if(!n)await fbReq('DELETE','challenge',null,A);else await fbReq('PUT','challenge',{target:n,title:(title||'Class challenge').slice(0,60)},A);},
  async premiumList(){let r={};try{r=(await fbReq('GET','prem',null,A))||{};}catch(e){}return Object.entries(r).map(([pid,v])=>({pid,name:(lbPlayers[pid]||{}).name||'(not on the leaderboard)',tag:ATAG[pid]||'',how:!v||!v.c?'?':v.c==='merge'?'merged in from another account':v.c==='admin'?'given by you':'code “'+v.c+'”',t:v&&v.t})).sort((a,b)=>String(a.name).localeCompare(b.name));},
  // the secret badges' answer codes on the server
  async secretCheck(){const out=[];let keys={};try{keys=(await fbReq('GET','sx/key',null,A))||{};}catch(e){return [[false,'Couldn’t read the answer codes: '+e.message]];}
    const per={};Object.values(keys).forEach(id=>{per[id]=(per[id]||0)+1;});const none=SX_IDS.filter(id=>!per[id]);
    out.push([!none.length,Object.keys(keys).length+' answer codes on the server for '+Object.keys(per).length+' of '+SX_IDS.length+' secret badges'+(none.length?' (missing for '+none.length+': upload the answers file again)':'')]);
    for(const [lbl,c] of [['11/11 typed quiz','q|typed|11/11'],['7 clicks on Latin','s|lc|7']]){const h=await sxHash(c);out.push([!!keys[h],lbl+(keys[h]?' is set up':' is not set up on the server: upload the newest answers file')]);}
    return out;},
  // upkeep, run when the admin site opens
  async duelsTidyAll(){try{const d=(await fbReq('GET','duels',null,A))||{},old=Date.now()-90*864e5,body={};Object.entries(d).forEach(([id,x])=>{if(x&&+x.t<old)body['duels/'+id]=null;});if(Object.keys(body).length)await fbReq('PATCH','',body,A);return Object.keys(body).length;}catch(e){return 0;}},
  async bfeedTidy(){try{const r=await fbReq('GET','bfeed',null,{...A,query:'?orderBy=%22$key%22&limitToLast=400'});const all=Object.entries(safeKeys(r)).map(([id,v])=>({id,...v})).filter(v=>v&&v.pid&&v.b);
    const keep=new Set(bfeedDedupe(all).map(v=>v.id)),body={};all.forEach(v=>{if(!keep.has(v.id))body['bfeed/'+v.id]=null;});const ks=Object.keys(body);
    for(let i=0;i<ks.length;i+=100){const part={};ks.slice(i,i+100).forEach(k=>part[k]=null);await fbReq('PATCH','',part,A);}return ks.length;}catch(e){return 0;}},
  async upkeep(){const r={};try{await srvAdminSetup();}catch(e){}r.pub=await this.pubSync();
    try{r.chat=await chatPurgeHidden();}catch(e){}try{await sxAdminTidy();}catch(e){}try{await claimsClear();}catch(e){}r.duels=await this.duelsTidyAll();r.feed=await this.bfeedTidy();return r;},
};
// ── moved here from the site, unchanged ──
async function adminRename(pid){const p=lbPlayers[pid];if(!p)return;const v=prompt('New name for '+p.name+':',p.name);if(v===null)return;
  const name=lbCleanName(v);if(name===p.name)return;let err='';if(name.length<2||name.length>30)err='Names must be 2–30 characters.';else if(!/^[\p{L}\p{N} _.'-]+$/u.test(name))err='Use letters, numbers, spaces, - _ . or \' only.';
  else if(Object.entries(lbPlayers).some(([id,x])=>id!==pid&&x&&String(x.name||'').toLowerCase()===name.toLowerCase()))err='Someone already has that name.';
  const old=p.name;if(err){alert(err);return;}try{await fbReq('PATCH','players/'+pid,{name},{admin:true});}catch(e){alert('Couldn’t rename: '+e.message);return;}
  logName(pid,name,'admin',true,old);}
async function showNameHistory(pid,box){box.textContent='Loading…';let h;
  try{h=await fbReq('GET','names/'+pid,null,{admin:true});}catch(e){box.textContent='Couldn’t load name history: '+e.message;return;}
  const list=Object.values(h||{}).filter(x=>x&&x.n).sort((a,b)=>(b.t||0)-(a.t||0));box.innerHTML='';
  // the name before each change: saved with it, or else the entry before it
  list.forEach((x,i)=>{if(!x.p&&x.by!=='join'&&list[i+1])x.p=list[i+1].n;});
  if(!list.length){box.textContent='No name changes recorded yet. (History starts from when this feature was added.)';return;}
  const tb=document.createElement('table');tb.className='nh-table';
  list.forEach(x=>{const tr=document.createElement('tr');const d=new Date(x.t||0);
    [d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),x.by==='join'?x.n:(x.p||'?')+' → '+x.n,x.by==='admin'?'renamed by admin':x.by==='join'?'joined':'changed it'+(x.p?'':' (old name not recorded)')]
      .forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===1)td.style.fontWeight='600';else td.className='muted';tr.appendChild(td);});tb.appendChild(tr);});
  box.appendChild(tb);}
async function adminCodes(box){const w=document.createElement('div');w.className='pw-admin';box.appendChild(w);
  const draw=async()=>{let codes={},prem={};try{[codes,prem]=await Promise.all([fbReq('GET','codes',null,{admin:true}),fbReq('GET','prem',null,{admin:true})]);}catch(e){w.textContent='Couldn’t load codes: '+e.message;return;}codes=codes||{};prem=prem||{};
    const used={};Object.entries(prem).forEach(([uid,x])=>{if(x&&x.c)(used[x.c]=used[x.c]||[]).push(lbPlayers[uid]?lbPlayers[uid].name:'(left)');});
    w.innerHTML='<div class="pw-code-h">Admin: premium codes</div>';
    Object.entries(codes).forEach(([c,v])=>{const r=document.createElement('div');r.className='pw-admin-row';const t=document.createElement('span');t.textContent='“'+c+'”: '+((v&&v.left)||0)+' use'+(((v&&v.left)===1)?'':'s')+' left'+(used[c]?' · used by '+used[c].join(', '):'');r.appendChild(t);
      const d=document.createElement('button');d.className='lb-act del';d.textContent='×';d.title='Delete code';d.onclick=async()=>{if(!confirm('Delete the code “'+c+'”? (People who already used it keep premium.)'))return;await fbReq('DELETE','codes/'+c,null,{admin:true}).catch(e=>alert(e.message));draw();};r.appendChild(d);w.appendChild(r);});
    const f=document.createElement('form');f.className='pw-code-row';f.innerHTML='<input placeholder="new code" maxlength="40"><input type="number" min="1" max="1000" value="3" style="width:64px;flex:none" title="uses"><button class="btn-secondary">Add</button>';
    f.onsubmit=async e=>{e.preventDefault();const [ci,ni]=f.querySelectorAll('input');const c=cleanCode(ci.value),n=Math.floor(+ni.value);if(!/^[a-z0-9 ]{1,40}$/.test(c)){alert('Codes can use letters, numbers and spaces only.');return;}if(!(n>=1)){alert('Uses must be 1 or more.');return;}
      try{await fbReq('PUT','codes/'+c,{left:n},{admin:true});}catch(err){alert('Couldn’t save: '+err.message);}draw();};w.appendChild(f);};
  draw();}
async function streakEdit(pid,name,btn){let cur=null;try{cur=await fbReq('GET','sset/'+pid,null,{admin:true});}catch(e){alert('Couldn’t load ('+e.message+'). Publish the latest database rules first.');return;}
  let now=null;try{now=await fbReq('GET','strk/'+pid,null,{admin:true});}catch(e){}
  const v=prompt('Daily goal streak for '+name+' (days in a row).'+(now&&typeof now.n==='number'?'\nCurrent streak: '+now.n+' (reported '+agoText(now.t)+(now.g?', goal '+now.g+', '+(now.d||0)+' today':', no daily goal set')+').':'\nTheir device hasn’t reported a streak yet.')+(cur?'\nLast set to '+cur.n+' on '+new Date(cur.t).toLocaleString()+'.':'')+'\nIt shows on their devices the next time they open the site; reaching today’s goal then adds 1.',cur?cur.n:'');if(v===null)return;
  const n=Math.round(+v);if(!(n>=0&&n<=3650)){alert('Enter a whole number from 0 to 3650.');return;}

function loadEngine(){return new Promise((res,rej)=>{const f=$('engine');f.onload=()=>{try{E=f.contentWindow;
    const s=E.document.createElement('script');s.textContent=$('engineModule').textContent;E.document.body.appendChild(s);ADM=E.ADM;if(!ADM)throw new Error('admin module didn’t start');
    // the site's styles (names, colours, badge chips, tables) so they look the same here
    E.document.querySelectorAll('style').forEach(st=>{const c=document.createElement('style');c.textContent=st.textContent;document.head.insertBefore(c,document.head.firstChild);});
    res();}catch(e){rej(e);}};f.onerror=()=>rej(new Error('couldn’t load the site'));f.src='index.html?engine=1&v='+Date.now();});}

// ── password: it unlocks the admin login, which is stored encrypted in the database ──
const ITER=600000,enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(pass,salt,it){const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await keyFor(pass,salt,ITER);
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return {s:b64(salt),iv:b64(iv),c:b64(c),it:ITER,v:1};}
async function unseal(v,pass){const k=await keyFor(pass,unb64(v.s),+v.it||ITER);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.c));return JSON.parse(dec.decode(p));}
let vault=null;
function gateView(mode,msg){const setup=mode==='setup',g=$('gate');g.classList.remove('ad-hide');
  g.innerHTML='<div class="g-box"><div style="font-size:30px">'+(setup?'🛠️':'🔒')+'</div><h1>'+(setup?'Set up admin access':'Admin')+'</h1>'
   +(setup?'<p>One time only. Enter the admin account’s email and Firebase password, then choose the password for this page. The login is stored encrypted: only this page’s password can unlock it.</p>'
     +'<input class="ad-in" id="gE" type="email" placeholder="Admin email" autocomplete="username"><input class="ad-in" id="gP" type="password" placeholder="Firebase password" autocomplete="current-password">'
     +'<input class="ad-in" id="gN" type="password" placeholder="New admin page password" autocomplete="new-password"><input class="ad-in" id="gN2" type="password" placeholder="Same password again" autocomplete="new-password">'
    :'<p>Enter the admin password.</p><input class="ad-in" id="gK" type="password" placeholder="Password" autocomplete="current-password">')
   +'<div class="g-err" id="gErr">'+esc(msg||'')+'</div><button class="ad-btn pri" style="width:100%" id="gGo">'+(setup?'Save and enter':'Enter')+'</button>'
   +(setup?(vault?'<button class="g-lnk" id="gBack">Back</button>':''):'<button class="g-lnk" id="gSet">Set up again / change password</button>')
   +'<div><a class="g-lnk" href="index.html">Go to the site</a></div></div>';
  const err=t=>{$('gErr').textContent=t;};
  g.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')$('gGo').click();}));
  if($('gSet'))$('gSet').onclick=()=>gateView('setup');if($('gBack'))$('gBack').onclick=()=>gateView('enter');
  setTimeout(()=>{const f=g.querySelector('input');if(f)f.focus();},50);
  $('gGo').onclick=async()=>{const btn=$('gGo');btn.disabled=true;err('');
    try{
      if(!setup){const k=$('gK').value;if(!k){err('Enter the password.');return;}
        let cred;try{cred=await unseal(vault,k);}catch(e){await new Promise(r=>setTimeout(r,1200));err('Wrong password.');$('gK').select();return;}
        let a;try{a=await ADM.signIn(cred.e,cred.p);}catch(e){err(/INVALID|PASSWORD|EMAIL|USER/.test(e.message)?'The saved admin login no longer works (was the Firebase password changed?). Use “Set up again”.':'Couldn’t reach the server. Check your internet.');return;}
        if(!(await enter(a)))err('The saved login isn’t the admin account. Use “Set up again”.');}
      else{const e=$('gE').value.trim(),p=$('gP').value,n=$('gN').value,n2=$('gN2').value;
        if(!e||!p||!n){err('Fill in every box.');return;}if(n!==n2){err('The two new passwords don’t match.');return;}if(n.length<6){err('Use at least 6 characters.');return;}
        let a;try{a=await ADM.signIn(e,p);}catch(x){err(/TOO_MANY/.test(x.message)?'Too many attempts. Wait a few minutes.':/INVALID|PASSWORD|EMAIL|USER/.test(x.message)?'Incorrect email or Firebase password.':'Couldn’t reach the server. Check your internet.');return;}
        if(a.uid!==ADM.uid){err('That account isn’t the admin.');return;}
        const v=await seal({e,p},n);try{await ADM.vaultPut(v,a.idToken);}catch(x){err(/40[13]/.test(x.message)?'Refused: publish the latest database rules first.':'Couldn’t save ('+x.message+').');return;}
        vault=v;await enter(a);toast('✓ Admin password saved.');}
    }finally{if($('gGo'))btn.disabled=false;}};}
async function enter(a){if(!a||a.uid!==ADM.uid)return false;ADM.setAuth(a);try{sessionStorage.setItem(SS,JSON.stringify({uid:a.uid,refreshToken:a.refreshToken}));}catch(e){}
  $('gate').classList.add('ad-hide');$('app').classList.remove('ad-hide');await reload();render();
  setTimeout(async()=>{const r=await ADM.upkeep();if(r&&(r.pub>0||r.feed>0||r.duels>0||r.chat>0))toast('Tidied up: '+[r.pub>0?r.pub+' public leaderboard updates':'',r.feed>0?r.feed+' repeated feed posts':'',r.duels>0?r.duels+' old challenges':'',r.chat>0?r.chat+' hidden chat messages':''].filter(Boolean).join(', ')+'.');},3000);
  return true;}

function status(pid){const s=[];if(pid===ADM.uid)s.push(['admin','a']);if(D.atag[pid])s.push(['member','g']);else if(D.appr[pid]===true)s.push(['approved','g']);else if(pid!==ADM.uid)s.push(['not approved','r']);
  if(D.hide[pid]===true)s.push(['hidden','r']);if(D.mute[pid]===true)s.push(['chat hidden','r']);if(D.prem[pid])s.push(['premium','a']);if(D.nlock[pid]===true)s.push(['name locked','']);return s;}
const ago=t=>{t=+t;if(!t)return '';const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';};

      tr.onclick=()=>openPanel(pid);t.appendChild(tr);});
    if(!list.length)t.insertAdjacentHTML('beforeend','<tr><td colspan="6" style="color:var(--text3)">Nobody here.</td></tr>');};
  draw();$('pq').oninput=e=>{query=e.target.value;draw();};$('pf').onchange=e=>{filter=e.target.value;draw();};

  +'<div class="ad-card"><h2>🏆 Public leaderboard</h2><p class="hint">Players read a public copy of the leaderboard. It’s kept up to date automatically while this page is open; this does it now.</p><button class="ad-btn sm" id="tP">Update it now</button></div>'
  +'<div class="ad-card"><h2>📚 Word list for badges</h2><p class="hint">Lexicon and Doctus badges count the words in the site. After adding words to the site, update this.</p><button class="ad-btn sm" id="tW">Update word list</button></div>'
  +'<div class="ad-card"><h2>🧹 Tidy up</h2><p class="hint">Runs each time you open this page: repeated badge-feed posts, challenges older than 90 days, messages from hidden players, old badge claims.</p><button class="ad-btn sm" id="tT">Tidy now</button></div>'
  +'<div class="ad-card"><h2>🔑 Admin page password</h2><p class="hint">Change this page’s password, or set it up again after changing the Firebase password.</p><button class="ad-btn sm" id="tK">Change password</button></div>'
  +'</div>';
  $('tR').onclick=()=>E.rulesCheck();
  $('tP').onclick=async()=>{const n=await ADM.pubSync();toast(n<0?'Couldn’t update it (check the database rules).':n?'✓ Updated '+n+' entries.':'✓ Already up to date.');};
  $('tW').onclick=async()=>{await E.srvAdminSetup();toast('✓ Word list up to date.');};
  $('tT').onclick=async()=>{const r=await ADM.upkeep();toast('✓ Tidied: '+(r.feed||0)+' feed repeats, '+(r.duels||0)+' old challenges, '+(r.chat||0)+' hidden messages.');};
  $('tK').onclick=()=>{$('app').classList.add('ad-hide');gateView('setup');};}

// ── start ──
(async()=>{try{await loadEngine();}catch(e){$('boot').textContent='Couldn’t load ('+e.message+'). Check your internet and refresh.';return;}
  $('boot').classList.add('ad-hide');
  try{const s=JSON.parse(sessionStorage.getItem(SS)||'null');if(s&&s.refreshToken){const a=await ADM.refresh(s);if(await enter(a))return;}}catch(e){try{sessionStorage.removeItem(SS);}catch(x){}}
  for(let i=0;i<4;i++){try{vault=await ADM.vaultGet();break;}catch(e){if(/40[13]/.test(e.message)){vault=null;break;}await new Promise(r=>setTimeout(r,1200*(i+1)));}}
  gateView(vault&&vault.c?'enter':'setup');})();
})();
</script>
</body>
</html>
